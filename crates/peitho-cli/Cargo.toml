[package]
name = "peitho-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface and daemon runner for PeithoSecure"

[[bin]]
name = "peitho"
path = "src/main.rs"

[lib]
name = "peitho_cli"
path = "src/lib.rs"

[dependencies]
peitho-core = { path = "../peitho-core" }
peitho-token = { path = "../peitho-token" }
peitho-mcp = { path = "../peitho-mcp" }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
hex = "0.4"
chrono = { workspace = true }

