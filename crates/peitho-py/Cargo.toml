[package]
name = "peitho-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings (PyO3) for PeithoSecure post-quantum capability tokens and AI agent security"

[lib]
name = "_peitho_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
peitho-core = { path = "../peitho-core" }
peitho-token = { path = "../peitho-token" }
peitho-mcp = { path = "../peitho-mcp" }
pyo3 = { workspace = true }
thiserror = { workspace = true }
serde_json = "1.0"
hex = "0.4"
