[workspace]
resolver = "2"
members = [
    "crates/peitho-core",
    "crates/peitho-token",
    "crates/peitho-mcp",
    "crates/peitho-cli",
    "crates/peitho-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PeithoSecure Team"]
license = "Apache-2.0"
repository = "https://github.com/peithotech/PeithoSecure"
readme = "README.md"

[workspace.dependencies]
# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization & Zeroization
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
sha3 = "0.10"

# Post-Quantum Cryptography
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

# Encryption & Key Management
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
axum = "0.7"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
